name: quiperd
description: "QUI PERD — application mobile : défis de match entre joueurs, séquestre et paiements Mobile Money."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Client HTTP de l'API (paquet officiel Dart), multipart compris pour l'envoi des preuves.
  http: ^1.5.0
  # Socket temps réel : le serveur POUSSE, l'application ne redemande jamais périodiquement.
  web_socket_channel: ^3.0.3
  # Jeton de session et préférences locales.
  shared_preferences: ^2.5.5
  # État partagé (session, portefeuille, notifications) via ChangeNotifier.
  provider: ^6.1.5+1
  # Formatage fr-FR des montants, dates et durées.
  intl: ^0.20.2
  # Captures et vidéos de preuve de match.
  image_picker: ^1.2.1
  # Ouverture de la page de paiement du prestataire Mobile Money.
  url_launcher: ^6.3.2
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Typographie IDENTIQUE au site : Unbounded pour les titres, Manrope pour le texte,
  # JetBrains Mono pour les chiffres. Fichiers variables embarqués (aucun téléchargement
  # au lancement) ; les graisses sont demandées par `fontVariations` dans theme/typographie.dart.
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
