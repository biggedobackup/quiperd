name: defisenligne
description: "QUI PERD — application mobile : défis de match entre joueurs, séquestre et paiements Mobile Money."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Client HTTP de l'API (paquet officiel Dart), multipart compris pour l'envoi des preuves.
  http: ^1.5.0
  # Socket temps réel : le serveur POUSSE, l'application ne redemande jamais périodiquement.
  web_socket_channel: ^3.0.3
  # Jeton de session et préférences locales.
  shared_preferences: ^2.5.5
  # État partagé (session, portefeuille, notifications) via ChangeNotifier.
  provider: ^6.1.5+1
  # Formatage fr-FR des montants, dates et durées.
  intl: ^0.20.2
  # Captures et vidéos de preuve de match.
  image_picker: ^1.2.1
  # Ouverture de la page de paiement du prestataire Mobile Money.
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  webview_flutter: ^4.14.1
  # Liens profonds : ouvrir l'application sur le bon écran quand on tape un lien partagé.
  app_links: ^6.4.1

  # Notifications push Firebase (projet `defisenligne`).
  #
  # Le socket ne couvre que l'application OUVERTE : dès qu'elle passe en arrière-plan ou qu'elle
  # est fermée, seul FCM peut prévenir le joueur qu'un adversaire a rejoint son défi ou déclaré
  # un résultat. C'est le complément du temps réel, pas son remplaçant.
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  # Android n'affiche RIEN quand un message FCM arrive alors que l'application est au premier
  # plan : c'est ce paquet qui dessine la bannière dans ce cas, et qui déclare le canal de
  # notification exigé depuis Android 8.
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Typographie IDENTIQUE au site : Unbounded pour les titres, Manrope pour le texte,
  # JetBrains Mono pour les chiffres. Fichiers variables embarqués (aucun téléchargement
  # au lancement) ; les graisses sont demandées par `fontVariations` dans theme/typographie.dart.
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
